name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Validate environment module
        run: node -e "require('./src/config/env'); console.log('env module ok')"
        env:
          MONGODB_URI: mongodb://localhost:27017/test
          SESSION_SECRET: ci-test-session-secret-32chars-min
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          GOOGLE_CALLBACK_URL: http://localhost:5000/auth/google/callback
          GROQ_API_KEY: test-groq-key
          ADZUNA_APP_ID: test-adzuna-id
          ADZUNA_APP_KEY: test-adzuna-key
          FRONTEND_URL: http://localhost:5173
          TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

      - name: Verify app loads
        run: node -e "require('./src/app'); console.log('app module ok'); process.exit(0)"
        env:
          MONGODB_URI: mongodb://localhost:27017/test
          SESSION_SECRET: ci-test-session-secret-32chars-min
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          GOOGLE_CALLBACK_URL: http://localhost:5000/auth/google/callback
          GROQ_API_KEY: test-groq-key
          ADZUNA_APP_ID: test-adzuna-id
          ADZUNA_APP_KEY: test-adzuna-key
          FRONTEND_URL: http://localhost:5173
          TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5000
